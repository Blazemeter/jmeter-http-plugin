name: CI Build

on:
  push:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.5 is the minimum supported JMeter version, 5.6.3 the latest; both are exercised
        # end-to-end (unit + HTTP parity regression tests) since ApacheJMeter_* are provided-scope
        # and the same compiled plugin must behave correctly against either at runtime.
        jmeter_version: ["5.5", "5.6.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # TEMPORARY: isolates why Jetty's connect to ::1 fails with EAFNOSUPPORT on the runner while a
      # plain blocking SocketChannel gets "Connection refused". Remove once the cause is known.
      - name: Diagnose IPv6 connect (temporary)
        run: |
          grep -n localhost /etc/hosts
          sysctl net.ipv6.conf.all.disable_ipv6 net.ipv6.conf.lo.disable_ipv6 || true
          cat /proc/cmdline
          if command -v bpftool >/dev/null; then sudo bpftool cgroup tree | head -40; else echo "bpftool not available"; fi
          cat > /tmp/JettyConnectProbe.java <<'EOF'
          import java.net.*;
          import java.nio.channels.*;
          import java.util.concurrent.*;
          public class JettyConnectProbe {
            public static void main(String[] args) throws Exception {
              int closed; try (ServerSocket s = new ServerSocket(0)) { closed = s.getLocalPort(); }
              InetSocketAddress v6 = new InetSocketAddress(InetAddress.getByName("::1"), closed);
              for (boolean opts : new boolean[] {false, true}) for (boolean blocking : new boolean[] {true, false}) for (boolean pool : new boolean[] {false, true}) {
                Callable<String> attempt = () -> {
                  try (SocketChannel c = SocketChannel.open()) {
                    if (opts) { c.setOption(StandardSocketOptions.TCP_NODELAY, true); c.setOption(StandardSocketOptions.SO_REUSEADDR, true);
                      try { c.setOption(StandardSocketOptions.SO_REUSEPORT, false); } catch (UnsupportedOperationException ignored) { } }
                    c.configureBlocking(blocking);
                    if (!c.connect(v6) && !blocking) { try (Selector sel = Selector.open()) { c.register(sel, SelectionKey.OP_CONNECT); sel.select(2000); c.finishConnect(); } }
                    return "connected?!";
                  } catch (Exception e) { return e.toString(); }
                };
                String r = pool ? Executors.newSingleThreadExecutor().submit(attempt).get() : attempt.call();
                System.out.println("options=" + opts + " blocking=" + blocking + " thread=" + (pool ? "pool" : "main") + " -> " + r);
              }
              System.exit(0);
            }
          }
          EOF
          java /tmp/JettyConnectProbe.java

      - name: Build and test (JMeter ${{ matrix.jmeter_version }})
        run: >-
          xvfb-run -a mvn -U --batch-mode
          -Djmeter.version=${{ matrix.jmeter_version }}
          clean install

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-build-artifacts-${{ matrix.jmeter_version }}-${{ github.run_id }}
          path: |
            target/jmeter-bzm-http2-*.jar
            target/jmeter-test
            target/failsafe-reports
            target/surefire-reports
          if-no-files-found: warn
          retention-days: 30
